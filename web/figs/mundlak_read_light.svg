<text x='43.60' y='379.13' style='font-size: 8.00px;fill: #7A8783; font-family: "PingFang HK";' textLength='304.00px' lengthAdjust='spacingAndGlyphs'>虛線為兩者相等。落在虛線上方越遠，代表『讀哪所學校』比『家庭背景』更決定成績</text>
